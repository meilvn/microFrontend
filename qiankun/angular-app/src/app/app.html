<mat-sidenav-container class="app-shell">
  <!-- 侧边导航 -->
  <mat-sidenav #sidenav mode="side" opened class="app-sidenav">
    <div class="app-sidenav__brand">
      <mat-icon>hub</mat-icon>
      <span>angular-app</span>
    </div>

    <mat-nav-list class="app-sidenav__nav">
      @for (item of navItems; track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>

    <div class="app-sidenav__note">
      供 qiankun 接入测试<br />
      全局样式 / 弹窗 / 动画 / @import
    </div>
  </mat-sidenav>

  <!-- 主内容区 -->
  <mat-sidenav-content>
    <mat-toolbar class="app-toolbar">
      <button mat-icon-button (click)="sidenav.toggle()" aria-label="切换导航">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="app-toolbar__title">{{ title() }}</span>
      <span class="app-toolbar__env">{{ envTag() }}</span>
      <span class="app-toolbar__spacer"></span>
      <button mat-raised-button color="primary" routerLink="/dialog">
        <mat-icon>open_in_new</mat-icon>
        弹窗演示
      </button>
    </mat-toolbar>

    <div class="app-content">
      <div class="app-content__route" [@routeAnim]="getRouteState(outlet)">
        <router-outlet #outlet="outlet"></router-outlet>
      </div>
    </div>

    <div class="app-footer">
      angular-app · Angular {{ angularVersion }} + Angular Material · 子应用独立端口 8003 ·
      样式：SCSS @import 链 + 全局选择器 + Material 主题
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
