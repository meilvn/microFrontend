<div class="app-page">
  <div class="app-section">
    <div class="app-section__title">
      <mat-icon>table_rows</mat-icon>
      数据表格
    </div>
    <div class="app-section__desc">
      Material 表格（排序 / 筛选 / 分页）+ 删除确认弹窗 · 行删除会联动弹窗与 Snackbar
    </div>

    <mat-card class="app-global-card">
      <div class="toolbar">
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>搜索（姓名 / 邮箱 / 角色）</mat-label>
          <mat-icon matPrefix>search</mat-icon>
          <input matInput placeholder="输入关键词过滤" [value]="filter" (input)="applyFilter($any($event.target).value)" />
        </mat-form-field>
        <span class="toolbar__count app-global-muted">共 {{ dataSource.filteredData.length }} 条</span>
      </div>

      <div class="table-wrap app-global-scroll">
        <table mat-table [dataSource]="dataSource" matSort class="demo-table">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>姓名</th>
            <td mat-cell *matCellDef="let row">{{ row.name }}</td>
          </ng-container>

          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>邮箱</th>
            <td mat-cell *matCellDef="let row">{{ row.email }}</td>
          </ng-container>

          <ng-container matColumnDef="role">
            <th mat-header-cell *matHeaderCellDef>角色</th>
            <td mat-cell *matCellDef="let row">
              <span class="app-global-badge">{{ row.role }}</span>
            </td>
          </ng-container>

          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>状态</th>
            <td mat-cell *matCellDef="let row">
              <span
                class="app-global-badge"
                [class.app-global-badge--ok]="row.status === 'active'"
                [class.app-global-badge--warn]="row.status === 'pending'"
                [class.app-global-badge--danger]="row.status === 'blocked'"
              >{{ statusLabel(row.status) }}</span>
            </td>
          </ng-container>

          <ng-container matColumnDef="createdAt">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>创建时间</th>
            <td mat-cell *matCellDef="let row">{{ row.createdAt }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>操作</th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button color="warn" (click)="deleteRow(row)" matTooltip="删除（弹窗确认）">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>

      <mat-paginator
        [pageSizeOptions]="[5, 10, 20]"
        showFirstLastButtons
        aria-label="分页"
      ></mat-paginator>
    </mat-card>
  </div>
</div>
